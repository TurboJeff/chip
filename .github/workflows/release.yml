name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Check the version matches the tag
        run: test "$(go run ./cmd/chip -version)" = "chipin chip ${GITHUB_REF_NAME#v}"
      - run: make release VERSION="$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS
          --repo "$GITHUB_REPOSITORY"
          --title "chipin chip $GITHUB_REF_NAME"
          --notes-file .github/release-notes.md
